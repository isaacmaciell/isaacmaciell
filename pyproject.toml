[project]
name = "artia-mcp"
version = "0.1.0"
description = "Servidor MCP para a API GraphQL do Artia: projetos, atividades e apontamentos de horas"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0",
    "httpx>=0.27",
    "graphql-core>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "openpyxl>=3.1"]
sync = ["openpyxl>=3.1"]

[project.scripts]
artia-mcp = "artia_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["artia_mcp"]
